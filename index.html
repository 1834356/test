<!DOCTYPE html>
<html>

        .favorite-link {
            font-size: 24px;

    background-color: yellow;

    </style>
    
<head>
    <meta charset="UTF-8">
    <title>Webページについて勉強中...</title>
</head>

<body>

    <h1>私のWebページ</h1>

    <h2>プロフィール</h2>
    <p>こんにちは！</p>
    <p>BMSをプレイしています。</p>

    <h2>リンク</h2>
    <a class="favorite-link" href="https://1834356.github.io/favorite/">私の好きな曲と譜面</a>

   <h2>ボタン</h2>

<button onclick="toggleImage()">
    画像を表示 / 非表示
</button>

<img id="myImage" src="d138.jpg" style="display: none;">

<script>
function toggleImage() {
    const image = document.getElementById("myImage");

    if (image.style.display === "none") {
        image.style.display = "block";
    } else {
        image.style.display = "none";
    }
}
</script>
</body>

</html>
