   <h2>画像切り替え</h2>

<button onclick="changeImage()">
    次の画像
</button>

<img id="myImage" src="a1.jpg" width="500">

<script>
let imageNumber = 1;

function changeImage() {
    imageNumber++;

    if (imageNumber > 2) {
        imageNumber = 1;
    }

    document.getElementById("myImage").src =
        "a" + imageNumber + ".jpg";
}
</script>
